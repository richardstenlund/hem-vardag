<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konton | Hem &amp; vardag</title>
  <link rel="stylesheet" href="vardag.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <main class="admin-main">
    <a href="/">← Hem &amp; vardag</a>
    <h1>Administrera konton</h1>
    <p>Varje användare skapar sitt eget konto via startsidan. Här kan du återställa ett glömt lösenord. Kontonas listor visas inte för administratören.</p>
    <p id="admin-status" role="status"></p>
    <div id="admin-users" class="item-grid"></div>
    <form id="admin-password-form" class="section-card" hidden>
      <h2>Återställ lösenord</h2>
      <label class="form-field">Konto<select name="userId" id="user-select" required></select></label>
      <label class="form-field">Nytt lösenord<input name="newPassword" type="password" minlength="8" maxlength="256" required autocomplete="new-password"></label>
      <button class="primary-button full-button" type="submit">Sätt nytt lösenord</button>
      <p id="admin-error" role="alert"></p>
    </form>
  </main>
</body>
</html>
