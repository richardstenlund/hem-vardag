<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title description">
  <title id="title">Hem &amp; vardag i Docker</title>
  <desc id="description">Webbläsaren når en fristående webbapp på port 3010. Egna konton och listor sparas i PostgreSQL. En backuptjänst sparar dagliga databasbackuper. Ingen koppling till träningsprojektet.</desc>
  <rect width="960" height="330" rx="16" fill="#f8f7f1"/>
  <g font-family="Arial,sans-serif" fill="#23382f">
    <text x="30" y="40" font-size="24">Hem &amp; vardag — egen Docker-installation</text>
    <rect x="30" y="90" width="190" height="125" rx="14" fill="#e3eee3"/>
    <text x="50" y="125" font-size="19">Webbläsare</text>
    <text x="50" y="158" font-size="15">http://SERVER:3010</text>
    <text x="50" y="187" font-size="15">Mobil / dator</text>
    <path d="M230 150 H300" stroke="#386b52" stroke-width="4"/>
    <rect x="310" y="90" width="250" height="125" rx="14" fill="#173b32"/>
    <text x="330" y="125" font-size="19" fill="#fff">web: Hem &amp; vardag</text>
    <text x="330" y="158" font-size="15" fill="#fff">Egna konton och listor</text>
    <text x="330" y="187" font-size="15" fill="#fff">Port i container: 3000</text>
    <path d="M570 150 H630" stroke="#386b52" stroke-width="4"/>
    <rect x="640" y="70" width="285" height="90" rx="14" fill="#e3eee3"/>
    <text x="660" y="103" font-size="19">db: PostgreSQL 16</text>
    <text x="660" y="132" font-size="15">Egen beständig datavolym</text>
    <rect x="640" y="180" width="285" height="90" rx="14" fill="#fae6d9"/>
    <text x="660" y="215" font-size="19">backup: daglig databaskopia</text>
    <text x="660" y="245" font-size="15">Egen backupvolym · 14 dagar</text>
    <text x="30" y="305" font-size="15">Docker Compose-projekt: hem-vardag. Kan köras bredvid andra sidor utan delade konton eller data.</text>
  </g>
</svg>
